<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Herramienta guiada para diseñar actividades de aula fundamentadas en el Marco AILit de alfabetización en IA (OCDE / Unión Europea, 2026).">
<title>Taller AILit · Diseña y aprende con el marco de alfabetización en IA</title>
<style>
:root{
  /* Paleta oficial del Marco AILit (muestreada del PDF original) */
  --int:#01408D; --int-05:#F2F6FB; --int-15:#D6E1EE;
  --cre:#CFFA7A; --cre-suave:#F1FCDC; --cre-texto:#3E5C12;
  --ges:#E75234; --ges-suave:#FBE4DF;
  --mol:#7794CA; --mol-suave:#E7ECF6;
  /* Neutros */
  --tinta:#12243A; --tinta-2:#4A5C70; --tinta-3:#64748B;
  --linea:#DAE1E9; --linea-2:#EDF1F5; --fondo:#F4F7FA; --papel:#FFFFFF;
  --r:12px; --sombra:0 1px 2px rgba(18,36,58,.05), 0 6px 18px rgba(18,36,58,.06);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--fondo);color:var(--tinta);
  font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.6;
}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .45em;font-weight:700}
p{margin:0 0 .85em}
a{color:var(--int)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{
  outline:3px solid var(--int);outline-offset:2px;border-radius:4px;
}
button{font:inherit;cursor:pointer}
img{max-width:100%}

/* ================= CABECERA ================= */
.banner-embed{
  background:var(--cre-suave);border-bottom:2px solid var(--cre);color:var(--cre-texto);
  padding:10px 16px;font-size:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.banner-embed .btn-banner{
  margin-left:auto;background:var(--int);color:#fff;text-decoration:none;font-weight:600;
  padding:7px 14px;border-radius:8px;white-space:nowrap;
}
header.app{background:var(--int);color:#fff;border-bottom:5px solid var(--cre)}
.cabecera{max-width:1240px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{
  width:40px;height:40px;border-radius:50%;flex:0 0 auto;
  background:conic-gradient(from 225deg,var(--cre) 0 25%,var(--ges) 25% 50%,var(--mol) 50% 75%,#1E5FB4 75% 100%);
  box-shadow:0 0 0 3px rgba(255,255,255,.22);
}
header.app h1{font-size:18px;margin:0}
header.app .sub{font-size:12.5px;opacity:.85;margin:1px 0 0}
nav.tabs{background:#013370;overflow-x:auto;-webkit-overflow-scrolling:touch}
nav.tabs ul{max-width:1240px;margin:0 auto;padding:0 8px;display:flex;gap:2px;list-style:none;white-space:nowrap}
nav.tabs button{
  background:transparent;border:0;color:#CBD9EA;padding:12px 15px;font-size:14.5px;font-weight:600;
  border-bottom:3px solid transparent;
}
nav.tabs button:hover{color:#fff}
nav.tabs button[aria-current="page"]{color:#fff;border-bottom-color:var(--cre)}

main{max-width:1240px;margin:0 auto;padding:20px 16px 80px}
.vista{display:none}
.vista.on{display:block}
.estrecho{max-width:820px;margin:0 auto}

/* ================= TARJETAS ================= */
.tarjeta{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);box-shadow:var(--sombra);margin-bottom:18px}
.tarjeta > .cab{padding:14px 18px;border-bottom:1px solid var(--linea)}
.tarjeta > .cab h2{font-size:17px;margin:0}
.tarjeta > .cab .pista{font-size:13px;color:var(--tinta-3);margin:3px 0 0}
.tarjeta > .cuerpo{padding:18px}
@media(max-width:560px){.tarjeta > .cuerpo,.tarjeta > .cab{padding:14px}}

/* ================= PORTADA ================= */
.hero{
  background:linear-gradient(180deg,var(--int) 0%,#0257B8 100%);color:#fff;border-radius:var(--r);
  padding:30px 26px;margin-bottom:20px;
}
.hero h2{font-size:26px;max-width:22ch}
.hero p{font-size:16.5px;opacity:.94;max-width:62ch}
.hero .acciones{margin-top:18px}
@media(max-width:560px){.hero{padding:22px 18px}.hero h2{font-size:22px}}
.video-caja{
  position:relative;width:100%;padding-top:56.25%;background:#0B1B2B;border-radius:10px;overflow:hidden;margin-bottom:6px;
}
.video-caja iframe,.video-caja video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.video-hueco{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#9FB4C9;text-align:center;padding:20px;font-size:14px;
}
.video-hueco b{color:#DCE7F2;display:block;margin-bottom:6px;font-size:15.5px}
.video-hueco code{background:rgba(255,255,255,.1);padding:2px 6px;border-radius:4px;font-size:13px}

.rejilla3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.rejilla2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media(max-width:820px){.rejilla3{grid-template-columns:1fr}}
@media(max-width:600px){.rejilla2{grid-template-columns:1fr}}
.bloque-amb{border:1px solid var(--linea);border-radius:10px;overflow:hidden;background:#fff;height:100%}
.bloque-amb .tit{padding:10px 13px;font-weight:700;font-size:14.5px}
.bloque-amb .txt{padding:12px 13px;font-size:13.6px;color:var(--tinta-2)}

/* ================= AVISOS ================= */
.aviso{border-left:4px solid var(--int);background:var(--int-05);padding:12px 14px;border-radius:0 8px 8px 0;margin:0 0 14px;font-size:14.5px}
.aviso:last-child{margin-bottom:0}
.aviso b{display:block;margin-bottom:3px}
.aviso.alerta{border-left-color:var(--ges);background:var(--ges-suave)}
.aviso.marco{border-left-color:var(--cre);background:var(--cre-suave)}
.aviso.calma{border-left-color:var(--mol);background:var(--mol-suave)}

/* ================= FORMULARIO ================= */
label.campo{display:block;margin-bottom:15px}
label.campo > .et{display:block;font-size:13px;font-weight:700;color:var(--tinta-2);margin-bottom:5px}
label.campo > .et .opt{font-weight:400;color:var(--tinta-3)}
input[type=text],input[type=number],select,textarea{
  width:100%;padding:11px 12px;border:1.5px solid var(--linea);border-radius:8px;
  font:inherit;font-size:15.5px;color:var(--tinta);background:#fff;
}
textarea{resize:vertical;min-height:96px}
.pista-campo{font-size:13px;color:var(--tinta-3);margin:5px 0 0}

.opcion{
  display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border:1.5px solid var(--linea);
  border-radius:10px;margin-bottom:9px;cursor:pointer;background:#fff;
}
.opcion:hover{border-color:var(--mol);background:var(--int-05)}
.opcion input{margin-top:4px;flex:0 0 auto;width:18px;height:18px;accent-color:var(--int)}
.opcion .txt{font-size:15px;flex:1;min-width:0}
.opcion.sel{border-color:var(--int);background:var(--int-05);box-shadow:inset 4px 0 0 var(--int)}
.opcion .def{display:block;font-size:13.4px;color:var(--tinta-2);margin-top:4px}
.cod{
  display:inline-block;font-size:12px;font-weight:700;letter-spacing:.4px;padding:2px 8px;
  border-radius:5px;background:var(--int);color:#fff;margin-right:8px;
}
.cod.gris{background:var(--linea-2);color:var(--tinta-2)}
.et-marco,.et-tuya{
  display:inline-block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
  padding:2px 8px;border-radius:5px;margin-left:8px;vertical-align:1px;white-space:nowrap;
}
.et-marco{background:var(--int);color:#fff}
.et-tuya{background:#fff;color:var(--tinta-2);border:1.5px dashed var(--tinta-3)}

/* ================= ÁMBITOS ================= */
.ambitos{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(max-width:620px){.ambitos{grid-template-columns:1fr}}
.amb{border:2px solid var(--linea);border-radius:11px;background:#fff;padding:0;overflow:hidden;text-align:left;display:flex;flex-direction:column;width:100%}
.amb:hover{border-color:var(--mol)}
.amb .barra{padding:11px 13px;font-weight:700;font-size:15px}
.amb .n{display:block;font-size:11.5px;font-weight:600;opacity:.85;margin-bottom:2px}
.amb .lema{padding:11px 13px;font-size:13.4px;color:var(--tinta-2);flex:1}
.amb .orden{padding:0 13px 11px;font-size:12.5px;color:var(--tinta-3)}
.amb.sel{border-color:var(--int);box-shadow:0 0 0 3px var(--int-15)}
.amb.sel .lema{color:var(--tinta)}

.niveles{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
@media(max-width:700px){.niveles{grid-template-columns:1fr}}
.niv{border:2px solid var(--linea);border-radius:11px;background:#fff;padding:14px;text-align:left;width:100%}
.niv:hover{border-color:var(--mol)}
.niv.sel{border-color:var(--int);background:var(--int-05);box-shadow:0 0 0 3px var(--int-15)}
.niv b{display:block;font-size:15.5px;margin-bottom:4px}
.niv small{color:var(--tinta-2);font-size:13.2px;display:block}

/* ================= MICROFORMACIÓN ================= */
.guia{border:1.5px solid var(--int-15);background:var(--int-05);border-radius:11px;padding:16px 17px;margin-bottom:20px}
.guia h3{font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:var(--int);margin:0 0 10px}
.guia .fila{display:flex;gap:11px;margin-bottom:11px;font-size:14.6px}
.guia .fila:last-of-type{margin-bottom:0}
.guia .fila .ic{
  flex:0 0 auto;width:24px;height:24px;border-radius:6px;background:var(--int);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;margin-top:1px;
}
.guia .fila.err .ic{background:var(--ges)}
.guia .fila strong{display:block}
.guia .fuente{font-size:12.5px;color:var(--tinta-3);border-top:1px solid var(--int-15);margin-top:12px;padding-top:9px}
.reflexion{background:#fff;border:1.5px solid var(--cre);border-radius:10px;padding:14px;margin-top:14px}
.reflexion .et{display:block;font-size:13px;font-weight:700;color:var(--cre-texto);margin-bottom:7px;text-transform:uppercase;letter-spacing:.5px}
.reflexion .preg{font-size:15.5px;font-weight:600;margin-bottom:9px;display:block}

/* ================= ASISTENTE ================= */
.progreso{background:#fff;border:1px solid var(--linea);border-radius:var(--r);padding:14px 16px;margin-bottom:18px;box-shadow:var(--sombra)}
.progreso .lin{height:8px;background:var(--linea-2);border-radius:99px;overflow:hidden;margin-bottom:9px}
.progreso .lin i{display:block;height:100%;background:var(--int);border-radius:99px;transition:width .3s}
.progreso .meta{display:flex;justify-content:space-between;gap:12px;font-size:13.4px;color:var(--tinta-2);flex-wrap:wrap}
.progreso .meta b{color:var(--tinta)}
.pasos-mini{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.pasos-mini button{
  border:1.5px solid var(--linea);background:#fff;color:var(--tinta-3);border-radius:7px;
  width:30px;height:30px;font-size:13px;font-weight:700;padding:0;
}
.pasos-mini button.hecho{border-color:var(--int);color:var(--int)}
.pasos-mini button.actual{background:var(--int);border-color:var(--int);color:#fff}
.nav-pasos{
  position:sticky;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid var(--linea);
  padding:12px 0;margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  backdrop-filter:blur(6px);
}
.btn{border:1.5px solid var(--int);background:var(--int);color:#fff;padding:11px 20px;border-radius:9px;font-weight:600;font-size:15px}
.btn:hover{filter:brightness(1.12)}
.btn.sec{background:#fff;color:var(--int)}
.btn.sec:hover{background:var(--int-05);filter:none}
.btn.fantasma{background:transparent;border-color:var(--linea);color:var(--tinta-2)}
.btn.fantasma:hover{background:var(--linea-2)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn.peq{padding:7px 13px;font-size:13.5px;border-radius:7px}
.acciones{display:flex;gap:10px;flex-wrap:wrap}
.empuje{margin-left:auto}
@media(max-width:560px){.empuje{margin-left:0}.nav-pasos .btn{flex:1 1 auto}}

/* ================= FICHA ================= */
.ficha{background:#fff;border:1px solid var(--linea);border-radius:var(--r);overflow:hidden;box-shadow:var(--sombra)}
.ficha .encab{padding:20px 22px;color:#fff;background:var(--int)}
.ficha .encab .kicker{font-size:11.5px;text-transform:uppercase;letter-spacing:1.1px;opacity:.85;font-weight:700}
.ficha .encab h2{font-size:22px;margin:5px 0 7px}
.ficha .encab .meta{font-size:13.5px;opacity:.92}
.ficha .contenido{padding:20px 22px}
@media(max-width:560px){.ficha .encab,.ficha .contenido{padding:16px}}
.bl{margin-bottom:22px}
.bl:last-child{margin-bottom:0}
.bl > h3{font-size:12px;text-transform:uppercase;letter-spacing:.9px;color:var(--tinta-3);border-bottom:2px solid var(--linea);padding-bottom:5px;margin-bottom:10px}
.bl ul,.bl ol{margin:0 0 10px;padding-left:22px}
.bl li{margin-bottom:6px}
.objetivo{background:var(--cre-suave);border-left:4px solid var(--cre);padding:14px 16px;border-radius:0 9px 9px 0;font-size:16px}
table.just{width:100%;border-collapse:collapse;font-size:14px}
table.just th,table.just td{border:1px solid var(--linea);padding:9px 11px;text-align:left;vertical-align:top}
table.just th{background:var(--linea-2);width:30%;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--tinta-2)}
@media(max-width:620px){
  table.just th,table.just td{display:block;width:100%;border-bottom:0}
  table.just tr{display:block;border-bottom:1px solid var(--linea)}
  table.just tr:last-child td:last-child{border-bottom:1px solid var(--linea)}
}
.chip{display:inline-block;font-size:13px;background:var(--linea-2);border:1px solid var(--linea);border-radius:6px;padding:3px 9px;margin:0 5px 5px 0}
.chip.marco{background:var(--int-05);border-color:var(--int-15)}
.chip.tuya{background:#fff;border-style:dashed;border-color:var(--tinta-3)}
.dialogo{background:var(--int-05);border-radius:9px;padding:12px 14px;margin-bottom:10px;font-size:14.5px}
.dialogo .p{font-weight:600;color:var(--int);display:block;margin-bottom:4px}
.fuente{font-size:12.5px;color:var(--tinta-3);border-top:1px solid var(--linea);padding-top:11px;margin-top:8px}

/* ================= EXPLORADOR ================= */
.buscador{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.buscador input{flex:1;min-width:200px}
.res{border:1px solid var(--linea);border-left-width:5px;border-radius:9px;padding:13px 15px;margin-bottom:10px;background:#fff}
.res h4{font-size:15px;margin:0 0 3px}
.res .ruta{font-size:12.5px;color:var(--tinta-3);margin-bottom:6px}
.res .frag{font-size:14px;color:var(--tinta-2)}
.res mark{background:var(--cre);color:var(--tinta);padding:0 2px;border-radius:3px}
.exp-amb{border:1px solid var(--linea);border-radius:var(--r);overflow:hidden;margin-bottom:16px;background:#fff;box-shadow:var(--sombra)}
.exp-amb > .tit{padding:14px 18px;font-weight:700}
.exp-amb .lema-exp{display:block;font-size:13px;font-weight:500;opacity:.92;margin-top:2px}
.exp-amb .desc{padding:13px 18px;font-size:14px;color:var(--tinta-2);border-bottom:1px solid var(--linea)}
details.comp{border-bottom:1px solid var(--linea)}
details.comp:last-child{border-bottom:none}
details.comp > summary{padding:13px 18px;cursor:pointer;font-size:15px;font-weight:600;list-style:none;display:flex;gap:11px}
details.comp > summary::-webkit-details-marker{display:none}
details.comp > summary:hover{background:var(--int-05)}
details.comp > summary .num{flex:0 0 auto;width:25px;height:25px;border-radius:6px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}
details.comp .det{padding:0 18px 18px;font-size:14.3px}
.niv-exp{border-left:3px solid var(--linea);padding-left:14px;margin:14px 0}
.niv-exp b{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--tinta-3)}
.niv-exp .aula{background:var(--linea-2);border-radius:8px;padding:10px 12px;font-size:13.8px;margin-top:6px}
.niv-exp .aula em{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--tinta-3);font-style:normal;font-weight:700;margin-bottom:3px}
table.tab{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
table.tab th,table.tab td{border:1px solid var(--linea);padding:9px 11px;text-align:left;vertical-align:top}
table.tab th{background:var(--linea-2);font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--tinta-2)}
table.tab td.c{width:56px;font-weight:700;color:var(--int);text-align:center}

/* ================= BIBLIOTECA / MODAL ================= */
.item-bib{border:1px solid var(--linea);border-radius:10px;padding:14px;margin-bottom:10px;background:#fff;display:flex;gap:13px}
.item-bib .franja{width:6px;border-radius:3px;flex:0 0 auto}
.item-bib .info{flex:1;min-width:0}
.item-bib h4{margin:0 0 3px;font-size:15.5px}
.item-bib .sub{font-size:13px;color:var(--tinta-3)}
.item-bib .bots{display:flex;gap:6px;flex-direction:column}
@media(max-width:620px){.item-bib{flex-wrap:wrap}.item-bib .bots{flex-direction:row;width:100%}}
.velo{position:fixed;inset:0;background:rgba(18,36,58,.6);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px}
.velo .caja{background:#fff;border-radius:12px;max-width:780px;width:100%;max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.velo .caja > header{padding:14px 18px;background:var(--int);color:#fff;display:flex;gap:12px;align-items:center}
.velo .caja > header h3{margin:0;font-size:16px;flex:1}
.velo .caja > header button{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:7px;padding:6px 13px;font-size:14px}
.velo .caja .cm{padding:16px 18px;overflow:auto}
.velo textarea{min-height:320px;font-family:ui-monospace,Consolas,monospace;font-size:13px}

/* ================= COMPROBACIÓN ================= */
.quiz .item{border:1.5px solid var(--linea);border-radius:10px;padding:13px 15px;margin-bottom:11px;background:#fff}
.quiz .item p{margin:0 0 9px;font-size:15px}
.quiz .bots{display:flex;gap:8px}
.quiz .fb{margin-top:10px;font-size:14px;padding:10px 12px;border-radius:8px;display:none}
.quiz .fb.on{display:block}
.quiz .fb.bien{background:var(--cre-suave);border-left:4px solid var(--cre)}
.quiz .fb.mal{background:var(--ges-suave);border-left:4px solid var(--ges)}

/* ================= IMPRESIÓN ================= */
@media print{
  body{background:#fff;font-size:11pt}
  header.app,nav.tabs,.banner-embed,.nav-pasos,.progreso,.no-print,.guia,.acciones{display:none !important}
  main{padding:0;max-width:none}
  .ficha{border:0;box-shadow:none}
  .ficha .encab{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .objetivo,.chip,table.just th,.dialogo{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bl{break-inside:avoid}
  a[href^="http"]::after{content:" (" attr(href) ")";font-size:9pt;color:#555}
}
</style>
</head>
<body>

<header class="app">
  <div class="cabecera">
    <div class="logo" aria-hidden="true"></div>
    <div>
      <h1>Taller AILit</h1>
      <p class="sub">Aprende el marco de alfabetización en IA diseñando una actividad para tu aula</p>
    </div>
  </div>
</header>

<nav class="tabs" aria-label="Secciones">
  <ul id="listaTabs"></ul>
</nav>

<main>
  <section id="v-inicio" class="vista on" aria-labelledby="t-inicio"></section>
  <section id="v-crear" class="vista" aria-labelledby="t-crear"></section>
  <section id="v-explorar" class="vista" aria-labelledby="t-explorar"></section>
  <section id="v-curriculo" class="vista" aria-labelledby="t-curriculo"></section>
  <section id="v-biblioteca" class="vista" aria-labelledby="t-biblioteca"></section>
  <section id="v-transparencia" class="vista" aria-labelledby="t-transparencia"></section>
</main>

<div id="anuncio" role="status" aria-live="polite" class="no-print" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"></div>

<script>
// ============================================================================
// BASE DE DATOS DEL MARCO AILit

const esc = t => String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const nrm = t => String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const minus = t => t ? t.charAt(0).toLowerCase()+t.slice(1) : t;
const sinPunto = t => String(t||"").replace(/\.\s*$/,"");
const $ = id => document.getElementById(id);

  let embebido=false, almacenBloqueado=false;
  const local = (location.protocol === "file:");
  try{ embebido = window.self !== window.top; }catch(e){ embebido = true; }
  try{ void window.localStorage; }catch(e){ almacenBloqueado = true; }
  return { embebido:embebido, archivoLocal:local, restringido: embebido || (almacenBloqueado && !local) };
})();

// Se usa el almacenamiento local del navegador. Nunca sale del equipo: el
// alojamiento solo entrega este archivo y la aplicación no realiza ninguna
// petición de red posterior. Si el navegador bloquea el almacenamiento (por

const CLAVE_ALMACEN = "tallerAILit.v1";

  try{ const k="__ailit_test"; localStorage.setItem(k,"1"); localStorage.removeItem(k); return true; }
  catch(e){ return false; }
})();
let tempGuardado=null;
function snapshot(){
  return { titulo:S.titulo, etapa:S.etapa, edad:S.edad, curso:S.curso, area:S.area, sesiones:S.sesiones,
    partida:S.partida, descripcion:S.descripcion, agrupamiento:S.agrupamiento, producto:S.producto,
    recursos:S.recursos, ambito:S.ambito?S.ambito.id:null, comp:S.comp?S.comp.num:null, nivel:S.nivel,
    con:[...S.con], hab:[...S.hab], act:[...S.act], etica:S.etica, curriculo:S.curriculo, ref:S.ref, quiz:S.quiz };
}
function restaurar(d){
  if(!d) return;
  ["titulo","edad","curso","area","sesiones","partida","descripcion","agrupamiento","producto","recursos","curriculo"].forEach(k=>S[k]=d[k]||"");
  S.etapa = d.etapa || "primaria";
  S.ambito = d.ambito ? AILIT.ambitos.find(x=>x.id===d.ambito) : null;
  S.comp = (S.ambito && d.comp) ? S.ambito.competencias.find(x=>x.num===d.comp) : null;
  S.nivel = d.nivel || null;
  S.con=new Set(d.con||[]); S.hab=new Set(d.hab||[]); S.act=new Set(d.act||[]);
  S.etica=d.etica||{}; S.ref=d.ref||{}; S.quiz=d.quiz||{};
}
function hayTrabajo(d){ return !!(d && (d.partida || d.titulo || d.ambito || d.descripcion)); }
function guardarLocal(){
  if(!ALMACEN) return;
  try{ localStorage.setItem(CLAVE_ALMACEN, JSON.stringify({v:1, ts:Date.now(), paso:PASO, estado:snapshot(), biblioteca:BIBLIOTECA})); }catch(e){}
}
function autoguardar(){ if(!ALMACEN) return; clearTimeout(tempGuardado); tempGuardado=setTimeout(guardarLocal,700); }
function leerLocal(){
  if(!ALMACEN) return null;
  try{ return JSON.parse(localStorage.getItem(CLAVE_ALMACEN)||"null"); }catch(e){ return null; }
}

}

  const f = new Date(RECUPERADO).toLocaleString("es-ES",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"});
  return '<div class="aviso marco no-print"><b>Hemos recuperado tu trabajo</b>'
    +'Continúas donde lo dejaste el '+esc(f)+'. Se guarda solo, en este dispositivo y en este navegador: no se envía a ningún servidor. '
    +'<button class="btn peq fantasma" style="margin-top:8px" onclick="RECUPERADO=null;reiniciar()">Prefiero empezar de cero</button></div>';
}

function irPaso(i){
  if(i<0||i>=PASOS.length) return;
  PASO=i; guardarLocal(); pintarCrear(); window.scrollTo({top:0,behavior:"smooth"});
}

function siguiente(){
  const p=PASOS[PASO], falta=validar(p.id);
  if(falta){ $("avisoPaso").textContent = falta; return; }
  irPaso(PASO+1);
}

function validar(id){
  if(id==="partida" && !S.partida.trim()) return "Escribe tu punto de partida antes de seguir.";
  if(id==="ambito" && !S.ambito) return "Elige una dimensión.";
  if(id==="competencia" && !S.comp) return "Elige una competencia.";
  if(id==="nivel" && !S.nivel) return "Elige un nivel de desempeño.";
  return "";
}

function pendientes(){
  const p=[];
  if(!S.partida.trim()) p.push({t:"Tu punto de partida",i:1});
  if(!S.ambito) p.push({t:"Dimensión",i:2});
  if(!S.comp) p.push({t:"Competencia",i:3});
  if(!S.nivel) p.push({t:"Nivel de desempeño",i:4});
  if(!S.descripcion.trim()) p.push({t:"Descripción de la actividad",i:6});
  const faltaEtica = eticaPendientes();
  if(faltaEtica.length) p.push({t:"Decisiones éticas y académicas ("+faltaEtica.length+" sin responder)",i:7});
  if(!S.curriculo.trim()) p.push({t:"Vinculación curricular",i:8});
  const sinRef = PASOS.filter(x=>x.guia && !(S.ref[x.id]||"").trim());
  if(sinRef.length) p.push({t:"Preguntas para pensar sin responder ("+sinRef.length+")",i:PASOS.indexOf(sinRef[0])});
  return p;
}

function usaIA(){
  const r=S.etica.usoAlumnado||"";
  return r.indexOf("No se usa ninguna")!==0;
}
function eticaPendientes(){
  const dependenIA=["edadDatos","datos","citar","verificar"];
  return ETICA.filter(q=>{
    if(!usaIA() && dependenIA.indexOf(q.id)>=0) return false;
    return !((S.etica[q.id]||"").trim());
  });
}

  fb.className="fb on "+(bien?"bien":"mal");
  fb.innerHTML=(bien?"<b>Correcto. </b>":"<b>No es así. </b>")+esc(q.exp);
}

      "<b>Planteamiento del reto (10 min).</b> Presentar la situación y explicitar los criterios de logro antes de empezar.",

}

function indicadores(){
  if(!S.comp||!S.nivel) return [];
  const o=[];
  o.push("Alcanza la expectativa que el marco fija para el nivel "+nivObj(S.nivel).nombre.toLowerCase()+": «"+sinPunto(S.comp.niveles[S.nivel].expectativa)+"».");
  [...S.hab].forEach(h=>{ const x=habObj(h); if(x) o.push("Moviliza la habilidad de "+x.nombre.toLowerCase()+": "+minus(x.definicion)); });
  [...S.act].forEach(a=>{ const x=actObj(a); if(x) o.push("Manifiesta la actitud de "+x.nombre.toLowerCase()+" a lo largo de la tarea."); });
  return o;
}

function fichaTexto(){
  if(!S.comp) return "";
  const a=S.ambito,c=S.comp,n=nivObj(S.nivel),d=c.niveles[S.nivel],L=[];
  const P=t=>L.push(t);
  P((S.titulo.trim()||"Actividad de alfabetización en IA").toUpperCase());
  P([S.curso,S.edad,S.area,S.sesiones].map(x=>x.trim()).filter(Boolean).join(" · ")); P("");
  P("OBJETIVO DE APRENDIZAJE"); P(objetivo()); P("");
  if(S.partida.trim()){ P("PUNTO DE PARTIDA DEL DOCENTE"); P("«"+S.partida.trim()+"»"); P(""); }
  P("ANCLAJE EN EL MARCO AILit");
  P("Dimensión: "+a.nombre+" — "+a.lema);
  P("Competencia "+a.id+"-"+c.num+" (código oficial "+a.codigoOficial+" "+c.num+"): "+c.enunciado);
  P("Nivel: "+n.nombre);
  P("Expectativa del marco: "+d.expectativa);
  P("Conocimientos: "+[...S.con].sort().join(", "));
  P("Habilidades: "+[...S.hab].map(h=>habObj(h)?habObj(h).nombre:h).join(", "));
  P("Actitudes: "+[...S.act].map(x=>actObj(x)?actObj(x).nombre:x).join(", ")); P("");
  P("DESCRIPCIÓN DE LA ACTIVIDAD"); P(S.descripcion.trim()||"(pendiente)"); P("");
  P("ESCENARIO DE REFERENCIA DEL MARCO"); P(d.escenario); P("");
  P("SECUENCIA DIDÁCTICA SUGERIDA"); secuencia().forEach((f,i)=>P((i+1)+". "+f.replace(/<[^>]+>/g,""))); P("");
  P("PRODUCTO FINAL O EVIDENCIA"); P(S.producto.trim()||"(pendiente)"); P("");
  P("INDICADORES DE LOGRO"); indicadores().forEach(i=>P("- "+i)); P("");
  P("DECISIONES ÉTICAS Y ACADÉMICAS");
  ETICA.forEach(q=>{ P("· "+q.preg); P("  "+((S.etica[q.id]||"").trim()||"(pendiente)")); }); P("");
  P("VINCULACIÓN CURRICULAR"); P(S.curriculo.trim()||"(pendiente)"); P("");
  P("DIARIO DE DECISIONES DEL DOCENTE");
  PASOS.filter(p=>p.guia).forEach(p=>{ P("· "+GUIA[p.guia].preg); P("  "+((S.ref[p.id]||"").trim()||"(sin responder)")); }); P("");
  P("TRANSPARENCIA: los enunciados de competencia, expectativa, escenario, conocimientos, habilidades y actitudes son literales del marco. El resto lo ha redactado el docente, salvo la secuencia y los indicadores, que son plantilla de la herramienta. Ningún texto ha sido generado por IA.");
  P("");
  P("REFERENCIA: "+AILIT.meta.fuente+" "+AILIT.meta.doi+" · Licencia "+AILIT.meta.licencia+".");
  return L.join("\n");
}

function aviso(t){ const e=$("estadoAcc"); if(e){ e.textContent=t; setTimeout(()=>{if(e.textContent===t)e.textContent="";},6000);} }
let ALT="";
function verAlt(t){ modalTexto(t, ALT); }
function descargar(blob,nombre,alt){
  try{
    const u=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=u; a.download=nombre; a.rel="noopener";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(u),1500);
    if(ENTORNO.restringido && typeof alt==="string"){
      ALT=alt;
      const e=$("estadoAcc");
      if(e) e.innerHTML='Se ha solicitado la descarga de <b>'+esc(nombre)+'</b>. Las páginas que incrustan contenido suelen bloquear las descargas: si no aparece, usa «Abrir a pantalla completa» o <a href="#" onclick="verAlt(\'Contenido de '+esc(nombre)+'\');return false;">copia el contenido desde aquí</a>.';
    }
    return true;
  }catch(e){
    if(typeof alt==="string") modalTexto("Descarga bloqueada: "+nombre, alt);
    else aviso("El navegador ha bloqueado la descarga. Abre la herramienta a pantalla completa.");
    return false;
  }
}
function nombreArchivo(){
  const t=(S.titulo.trim()||"actividad-ailit").toLowerCase().normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  return (codigo()?codigo().toLowerCase()+"-":"")+(t||"actividad-ailit");
}
function copiarTexto(){
  if(!S.comp){ aviso("Completa antes dimensión, competencia y nivel."); return; }
  const t=fichaTexto();
  if(navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(t).then(()=>aviso("Ficha copiada al portapapeles."),()=>copiaManual(t));
  else copiaManual(t);
}
function copiaManual(t){
  const ta=document.createElement("textarea");
  ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  let ok=false; try{ ok=document.execCommand("copy"); }catch(e){ ok=false; }
  document.body.removeChild(ta);
  ok ? aviso("Ficha copiada al portapapeles.") : modalTexto("Copia manual de la ficha", t);
}

  BIBLIOTECA.unshift({
    id: Date.now()+"-"+Math.random().toString(36).slice(2,7),
    fecha: new Date().toISOString(),

  });

}

function exportarBiblioteca(){
  if(!BIBLIOTECA.length){ alert("No hay actividades guardadas todavía."); return; }
  const j=JSON.stringify({app:"taller-ailit",version:3,actividades:BIBLIOTECA},null,2);
  descargar(new Blob([j],{type:"application/json"}),"mis-actividades-ailit.json", j);
}
function importarBiblioteca(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
      const d=JSON.parse(r.result), arr=Array.isArray(d)?d:(d.actividades||[]);
      if(!arr.length) throw 0;
      BIBLIOTECA=arr.concat(BIBLIOTECA); guardarLocal(); pintarBiblioteca();
      alert("Se han importado "+arr.length+" actividades.");
    }catch(e){ alert("El archivo no tiene el formato esperado."); } };
  r.readAsText(f); ev.target.value="";
}

let INDICE=[];

  INDICE=[];
  AILIT.ambitos.forEach(a=>a.competencias.forEach(c=>{
    INDICE.push({t:"Competencia", tit:a.id+"-"+c.num, ruta:a.nombre, txt:c.enunciado, col:a.color, amb:a.id, num:c.num, niv:null});
    AILIT.niveles.forEach(n=>{
      INDICE.push({t:"Expectativa", tit:a.id+"-"+c.num+" · "+n.nombre, ruta:a.nombre+" › "+c.enunciado, txt:c.niveles[n.id].expectativa, col:a.color, amb:a.id, num:c.num, niv:n.id});
      INDICE.push({t:"Escenario de aula", tit:a.id+"-"+c.num+" · "+n.nombre, ruta:a.nombre+" › "+c.enunciado, txt:c.niveles[n.id].escenario, col:a.color, amb:a.id, num:c.num, niv:n.id});
    });
  }));
  AILIT.conocimientos.forEach(b=>b.items.forEach(i=>
    INDICE.push({t:"Conocimiento", tit:i.id, ruta:b.titulo, txt:i.texto, col:"#01408D", amb:null})));

}

  if(!res.length){ cont.innerHTML='<div class="aviso alerta"><b>Sin resultados para «'+esc(q)+'»</b>Prueba con otra palabra, o explora por facetas (área curricular, ética, impacto social, nivel tecnológico) en el <a href="'+ENLACES.interactivo+'" target="_blank" rel="noopener">marco interactivo oficial</a>.</div>'; return; }
  cont.innerHTML='<p class="pista-campo"><b>'+res.length+'</b> resultado(s) para «'+esc(q)+'»</p>'
    + res.slice(0,60).map(x=>`<div class="res" style="border-left-color:${x.col}">
        <h4>${esc(x.t)}: ${esc(x.tit)}</h4>
        <div class="ruta">${esc(x.ruta)}</div>
        <div class="frag">${resaltar(x.txt,q)}</div>
        ${x.amb?`<div style="margin-top:9px"><button class="btn peq sec" onclick="irADisenar('${x.amb}',${x.num},${x.niv?"'"+x.niv+"'":"null"})">Diseñar una actividad con esto</button></div>`:""}
      </div>`).join("");
}
function resaltar(txt,q){
  const s=nrm(q).trim(); const base=nrm(txt); let out="",i=0;
  while(true){
    const p=base.indexOf(s,i); if(p<0||!s){ out+=esc(txt.slice(i)); break; }
    out+=esc(txt.slice(i,p))+"<mark>"+esc(txt.slice(p,p+s.length))+"</mark>"; i=p+s.length;
  }
  return out;
}
function irADisenar(amb,num,niv){
  S.ambito=AILIT.ambitos.find(a=>a.id===amb);
  S.comp=S.ambito.competencias.find(c=>c.num===num);
  S.con=new Set(S.comp.conocimientos); S.hab=new Set(S.comp.habilidades); S.act=new Set(S.comp.actitudes);
  S.nivel=niv||S.nivel||"basico";
  PASO=0; verVista("crear"); pintarCrear();
}

function reiniciar(silencioso){
  if(!silencioso && !confirm("¿Empezar una actividad nueva? Se vaciará el formulario. Las actividades guardadas no se borran.")) return;
  ["titulo","edad","curso","area","sesiones","partida","descripcion","agrupamiento","producto","recursos","curriculo"].forEach(k=>S[k]="");
  S.etapa="primaria"; S.ambito=null; S.comp=null; S.nivel=null;
  S.con.clear(); S.hab.clear(); S.act.clear(); S.etica={}; S.ref={}; S.quiz={};
  PASO=0; RECUPERADO=null; guardarLocal(); pintarCrear(); window.scrollTo({top:0,behavior:"smooth"});
}
